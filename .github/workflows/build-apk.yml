# Builds the Android APK on GitHub's servers — no Android Studio needed locally.
# Download the result from: GitHub repo → Actions → latest run → Artifacts → smartsync-apk
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_KEY
# Optional (for a fixed signing key, so updates install over older versions):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# Optional repository variable:
#   ALLOWED_EMAIL_DOMAIN  (e.g. eng.ruh.ac.lk)

name: Build APK

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

# A newer push cancels an older build that is still waiting or running.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Write env.json from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ALLOWED_EMAIL_DOMAIN: ${{ vars.ALLOWED_EMAIL_DOMAIN }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Add SUPABASE_URL and SUPABASE_KEY in Settings → Secrets and variables → Actions"
            exit 1
          fi
          printf '{"SUPABASE_URL":"%s","SUPABASE_KEY":"%s","ALLOWED_EMAIL_DOMAIN":"%s"}' \
            "$SUPABASE_URL" "$SUPABASE_KEY" "$ALLOWED_EMAIL_DOMAIN" > env.json

      - name: Set up release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No KEYSTORE_BASE64 secret — using a temporary debug key. Uninstall the old app before installing a new build."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=release.jks"
          } > android/key.properties

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      - name: Build APK
        run: flutter build apk --release --dart-define-from-file=env.json

      - uses: actions/upload-artifact@v4
        with:
          name: smartsync-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
